[package]
name = "ZenithBar"
version = "0.6.2"
edition = "2024"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", features = ["compat-1-2", "unstable-winit-030", "raw-window-handle-06"] }
sysinfo = "0.40.3"
toml = "1.2.1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[target."cfg(not(target_os = \"windows\"))".dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
x11rb = "0.13.2"

[build-dependencies]
slint-build = "1.18.1"
winres = "0.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true



